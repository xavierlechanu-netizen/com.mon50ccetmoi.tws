<!doctype html>
<html lang="fr">
  <head>
    <!-- Phase 3 : Zero-Trust DOM Security -->
    <script src="/vendor/dompurify/purify.min.js"></script>
    <script type="module" src="/js/dom-security.js"></script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - mon50ccetmoi</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="assets/icons/icon-192x192.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/css/style.min.css?v=50018" />
    <style>
      .admin-header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        padding: 15px 20px;
      }
      .admin-header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .btn-admin-link {
        padding: 8px 15px;
        background: rgba(255, 255, 255, 0.1);
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-size: 0.9rem;
        white-space: nowrap;
      }
      .btn-admin-logout {
        padding: 8px 15px;
        background: #ff4444;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>

    <!-- Google Firebase & Config -->
    <script type="module" src="/js/config.js"></script>
    <script type="module" src="/js/crypto-native.js" charset="utf-8"></script>
    <script type="module" src="/js/auth.js?v=50018"></script>
    <script type="module" src="/js/inline-admin-1.js"></script>
    <script type="module" src="/js/error-tracking.js?v=1008000"></script>
  <!-- AXEPTIO CMP -->
<script type="module" src="/js/axeptio-config.js"></script>

  <body class="admin-body">
    <div class="admin-header">
      <h1 style="margin: 0; font-size: 1.5rem">
        <i class="fa-solid fa-user-shield"></i> Admin
      </h1>
      <div class="admin-header-actions">
        <a href="admin-blackbox.html" class="btn-admin-link" style="background: linear-gradient(135deg, #ffb700, #ff8800); color: #0b1120; font-weight: 700; border: none;"><i class="fa-solid fa-microchip"></i> Registre Black Box</a>
        <a href="app.html" class="btn-admin-link"
          ><i class="fa-solid fa-map-location-dot"></i> Le GPS</a
        >
        <button data-action="logout()" class="btn-admin-logout">
          <i class="fa-solid fa-power-off"></i>
        </button>
      </div>
    </div>

    <div class="admin-dashboard">
      <div class="admin-panel">
        <h2>Membres Isolés (<span id="user-count">0</span>)</h2>
        <div class="admin-list-container">
          <ul id="user-list" class="admin-list"></ul>
        </div>
      </div>

      <div class="admin-panel">
        <h2>
          Signalements Dangers sur Carte (<span id="hazard-count">0</span>)
        </h2>
        <div class="admin-list-container">
          <ul id="hazard-list" class="admin-list"></ul>
        </div>
        <button data-action="clearAllHazards()" class="btn-clear-all">
          <i class="fa-solid fa-broom"></i> Effacer tous les signalements
        </button>
      </div>

      <div class="admin-panel">
        <h2>Fil d'Actualités / Humeurs (<span id="mood-count">0</span>)</h2>
        <div class="admin-list-container">
          <ul id="mood-list" class="admin-list"></ul>
        </div>
        <p style="font-size: 0.8rem; color: #aaa; margin-top: 10px">
          Gérez les débordements sur la messagerie réseau.
        </p>
      </div>

      <div class="admin-panel">
        <h2>Boîte à Idées (<span id="suggestion-count">0</span>)</h2>
        <div class="admin-list-container">
          <ul id="suggestion-list" class="admin-list"></ul>
        </div>
        <p style="font-size: 0.8rem; color: #aaa; margin-top: 10px">
          Suggestions de membres pour l'amélioration.
        </p>
      </div>
    </div>

    <script type="module" src="/js/inline-admin-2.js"></script>
  </body>
</html>
