<div id="ai-diagnostic-modal" class="hidden fullscreen-overlay" style="
        background: linear-gradient(135deg, #020617 0%, #000 100%);
        color: #fff;
        z-index: 36000;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        overflow-y: auto;
        padding-bottom: 50px;
      ">
      <button data-action="document.getElementById('ai-diagnostic-modal').classList.add('hidden')" style="
          position: absolute;
          top: 20px;
          right: 20px;
          background: rgba(255, 255, 255, 0.1);
          border: 1px solid rgba(255, 255, 255, 0.2);
          border-radius: 50%;
          width: 40px;
          height: 40px;
          color: #fff;
          font-size: 1.2rem;
          cursor: pointer;
        ">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div style="margin-top: 50px; text-align: center">
        <i class="fa-solid fa-microchip" style="
            font-size: 4rem;
            color: #00d2ff;
            filter: drop-shadow(0 0 20px #00d2ff);
            margin-bottom: 10px;
          "></i>
        <h1 style="margin: 0; font-size: 2rem; letter-spacing: 2px; color: #fff">
          Diagnostic IA
        </h1>
        <p style="color: #0f0; font-weight: bold; margin-top: 5px">
          Analyse Prédictive Télémétrique
        </p>
      </div>

      <div style="
          margin: 30px auto;
          width: 90%;
          max-width: 450px;
          background: rgba(0, 210, 255, 0.05);
          border: 1px solid rgba(0, 210, 255, 0.3);
          border-radius: 20px;
          padding: 30px 20px;
          text-align: center;
          box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        ">
        <h3 style="color: #aaa; margin: 0 0 10px 0; font-size: 1rem">
          Santé Globale
        </h3>
        <div id="ai-health-score" style="
            font-size: 4rem;
            font-weight: 900;
            color: #0f0;
            text-shadow: 0 0 20px #0f0;
          ">
          100%
        </div>
        <div style="color: #fff; font-size: 1rem; margin-top: 5px; opacity: 0.7">
          Statut: Opérationnel
        </div>
      </div>

      <!-- Composants -->
      <div style="margin: 20px auto; width: 90%; max-width: 450px">
      </div>
    </div>
