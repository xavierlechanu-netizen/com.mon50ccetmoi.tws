name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Une publication à la fois : la suivante attend son tour (annuler une publication Pages
# déjà lancée provoquait l'erreur « in progress deployment »)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test (bloque le deploiement si un test echoue)
        run: npm test
      - name: Build
        run: npm run build
      # La publication est bloquée si une page ne se charge plus, si un bouton de la barre
      # plante ou si le poids au démarrage dépasse le budget (étape 2 du plan de dette technique)
      - name: Budget de poids au démarrage
        run: npm run check:size
      - name: Installer le navigateur de test (Chromium)
        run: npx playwright install --with-deps chromium
      - name: Tests dans un vrai navigateur
        run: npm run test:e2e
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'
          # Indispensable : /.well-known/assetlinks.json (lien entre le site et l'app Play Store)
          # est dans un dossier caché, exclu par défaut depuis la v4.
          include-hidden-files: true

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.try1.outputs.page_url || steps.try2.outputs.page_url || steps.try3.outputs.page_url || steps.try4.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    # GitHub Pages refuse une publication tant que la précédente est encore « en cours » de son
    # côté (erreur « in progress deployment »), ce qui dure jusqu'à ~35 min après une publication
    # réussie (constaté le 7/11/2026). On réessaie donc jusqu'à 4 fois sur ~30 minutes.
    steps:
      - name: Publication (tentative 1)
        id: try1
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Attente avant la tentative 2
        if: steps.try1.outcome == 'failure'
        run: sleep 600
      - name: Publication (tentative 2)
        id: try2
        if: steps.try1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Attente avant la tentative 3
        if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
        run: sleep 600
      - name: Publication (tentative 3)
        id: try3
        if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Attente avant la tentative 4
        if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure' && steps.try3.outcome == 'failure'
        run: sleep 600
      - name: Publication (tentative 4)
        id: try4
        if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure' && steps.try3.outcome == 'failure'
        uses: actions/deploy-pages@v5
