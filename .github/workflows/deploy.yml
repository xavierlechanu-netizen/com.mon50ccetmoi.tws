name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Une publication à la fois : la suivante attend son tour (annuler une publication Pages
# déjà lancée provoquait l'erreur « in progress deployment »)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test (bloque le deploiement si un test echoue)
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'
          # Indispensable : /.well-known/assetlinks.json (lien entre le site et l'app Play Store)
          # est dans un dossier caché, exclu par défaut depuis la v4.
          include-hidden-files: true

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      # GitHub Pages refuse parfois une publication tant que la précédente est encore
      # « en cours » de son côté (erreur « in progress deployment ») : on réessaie une fois.
      - name: Attendre avant une seconde tentative
        if: steps.deployment.outcome == 'failure'
        run: sleep 300
      - name: Deploy to GitHub Pages (seconde tentative)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
