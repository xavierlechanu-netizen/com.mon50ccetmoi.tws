name: CI Quality & Security Pipeline

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Root Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Budget de poids au démarrage
        run: npm run check:size

      - name: Installer le navigateur de test (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Tests dans un vrai navigateur (pages, carte, barre d'outils)
        run: npm run test:e2e

      - name: Install & Audit Cloud Functions
        run: |
          npm ci --prefix functions
          npm audit --prefix functions --audit-level=high
