name: CI Quality & Security Pipeline

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Root Dependencies
        run: npm ci

      # Serveur souverain (VPS OVHcloud) : ses tests chargent ses propres dépendances
      # (@aws-sdk/client-s3 pour le coffre des preuves et les sauvegardes).
      - name: Dépendances du serveur souverain
        run: npm ci --prefix sovereign-core

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Budget de poids au démarrage
        run: npm run check:size

      - name: Installer le navigateur de test (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Tests dans un vrai navigateur (pages, carte, barre d'outils)
        run: npm run test:e2e

      - name: Install & Audit Cloud Functions
        run: |
          npm ci --prefix functions
          npm audit --prefix functions --audit-level=high

      - name: Audit du serveur souverain
        run: npm audit --prefix sovereign-core --audit-level=high

  # Ce qui part sur le VPS OVHcloud : scripts d'installation, composition Docker, image de l'API.
  vps:
    name: Serveur souverain (VPS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Scripts du VPS (shellcheck)
        run: shellcheck -x --severity=warning sovereign-core/deploy/*.sh

      - name: Composition Docker du VPS
        run: |
          # Valeurs factices pour les variables obligatoires (le vrai .env n'est jamais dans git).
          sed -E 's/^(DB_PASSWORD|SOVEREIGN_JWT_PRIVATE_KEY|SOVEREIGN_JWT_PUBLIC_KEY|BACKUP_PASSPHRASE|WORM_S3_ACCESS_KEY_ID|WORM_S3_SECRET_ACCESS_KEY)=.*/\1=valeur-de-test/' \
            sovereign-core/deploy/env.vps.example > "$RUNNER_TEMP/vps.env"
          docker compose -f sovereign-core/docker-compose.vps.yml --env-file "$RUNNER_TEMP/vps.env" config --quiet

      - name: Caddy sert le site (adresses sans .html, 404, en-têtes de sécurité)
        run: |
          # Faux site, rangé comme le fait deploy/publish-site.sh (releases/<date> + lien « current »)
          site="$RUNNER_TEMP/site"
          mkdir -p "$site/releases/v1"
          echo '<html>accueil</html>' > "$site/releases/v1/index.html"
          echo '<html>cockpit</html>' > "$site/releases/v1/app.html"
          echo '<html>introuvable</html>' > "$site/releases/v1/404.html"
          ln -s releases/v1 "$site/current"
          img=$(grep -oE 'caddy:[0-9.]+-alpine' sovereign-core/docker-compose.vps.yml)
          # Configuration avec le site en ligne (domaine réel) : doit être valide
          docker run --rm -v "$PWD/sovereign-core/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e API_DOMAIN=api.example.com -e ACME_EMAIL=ci@example.com \
            -e SITE_DOMAIN=example.com -e SITE_WWW_DOMAIN=www.example.com \
            "$img" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          # Avant la bascule DNS (SITE_DOMAIN vide → port interne 8081)
          docker run -d --name caddy-ci -p 8081:8081 \
            -v "$PWD/sovereign-core/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$site:/srv/site:ro" \
            -e API_DOMAIN=localhost -e ACME_EMAIL=ci@example.com -e SITE_DOMAIN=:8081 -e SITE_WWW_DOMAIN=:8082 "$img"
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8081/ && break; sleep 1; done
          curl -fsS http://127.0.0.1:8081/ | grep -q accueil
          curl -fsS http://127.0.0.1:8081/app | grep -q cockpit
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/nexiste-pas)" = 404
          curl -s http://127.0.0.1:8081/nexiste-pas | grep -q introuvable
          headers=$(curl -sI http://127.0.0.1:8081/app)
          echo "$headers"
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          echo "$headers" | grep -qi '^cache-control: no-cache'
          echo "$headers" | grep -qi '^permissions-policy:.*camera=(self)'
          docker rm -f caddy-ci

      - name: Image Docker de l'API
        run: docker build -f sovereign-core/Dockerfile -t mon50cc-api:ci .

      - name: L'image démarre et répond (sans base ni coffre)
        run: |
          # Mode développement : stockage en mémoire, coffre local. Vérifie que l'image contient
          # tout ce qu'il faut pour démarrer (code, dépendances, modules partagés).
          docker run -d --name api-ci -p 8080:8080 -e NODE_ENV=development mon50cc-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs api-ci
          exit 1
