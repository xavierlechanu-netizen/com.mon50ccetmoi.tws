name: Build Android APK

# Version Capacitor (dossier android/), non publiée sur le Play Store.
# Capacitor 8 demande Java 21 ; le site se compile avec Node 22 (comme la CI).

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permet de lancer la compilation manuellement depuis GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'

    - name: Setup Java (Android SDK requirements)
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: gradle

    - name: Install dependencies
      run: npm ci

    - name: Build Web App (Vite)
      run: npm run build

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Build APK (Gradle)
      working-directory: android
      run: |
        sed -i -e 's/\r$//' gradlew
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Mon50cc-Android-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
