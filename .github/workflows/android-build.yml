name: Build Android App

# App du Play Store (Trusted Web Activity, dossier app/).
# La clé de signature n'est pas sur GitHub : cette compilation produit une version
# NON signée, qui sert à vérifier que le code compile. La version publiée sur le
# Play Store est signée sur le poste de publication.

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Fix gradlew line endings
        run: sed -i -e 's/\r$//' gradlew

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (AAB)
        run: ./gradlew bundleRelease

      - name: Build with Gradle (APK)
        run: ./gradlew assembleRelease

      - name: Upload AAB (non signé)
        uses: actions/upload-artifact@v7
        with:
          name: app-release-unsigned.aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK (non signé)
        uses: actions/upload-artifact@v7
        with:
          name: app-release-unsigned.apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
