; ============================================================================
; PlatformIO Project Configuration File for Blackbox (REV3 / Aragon)
; Target : ESP32-C3-MINI-1 (RISC-V, 160MHz, BLE 5.0, Hardware Cryptography)
; Framework : ESP-IDF v5.x
; ============================================================================

[platformio]
src_dir = main
include_dir = main

[env:esp32-c3-devkitm-1]
platform = espressif32 @ ^6.5.0
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
board_build.f_flash = 80000000L

build_flags = 
    -I components/blackbox
    -I components/ble_comm
    -I components/gps
    -I components/imu
    -I components/tamper
    -D CORE_DEBUG_LEVEL=3

monitor_filters = esp32_exception_decoder, time, default
upload_speed = 921600

