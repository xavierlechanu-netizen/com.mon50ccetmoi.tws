<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Page introuvable — mon 50cc et moi</title>
    <meta
      name="description"
      content="Cette page n'existe pas. Retournez à l'application mon50ccetmoi."
    />
    <link rel="icon" type="image/png" href="assets/icons/icon-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Inter", sans-serif;
        background: #05080f;
        color: #fff;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }
      body::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 600px;
        height: 600px;
        transform: translate(-50%, -50%);
        background: radial-gradient(
          circle,
          rgba(255, 183, 0, 0.08) 0%,
          transparent 70%
        );
        pointer-events: none;
      }
      .container {
        text-align: center;
        z-index: 2;
        padding: 40px;
      }
      .error-code {
        font-size: 8rem;
        font-weight: 900;
        line-height: 1;
        background: linear-gradient(
          135deg,
          #ffb703 0%,
          #ff0055 50%,
          #00d2ff 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 30px rgba(255, 183, 3, 0.3));
        margin-bottom: 20px;
      }
      .error-icon {
        font-size: 4rem;
        color: #ffb703;
        margin-bottom: 20px;
        filter: drop-shadow(0 0 15px rgba(255, 183, 3, 0.5));
        animation: float 3s ease-in-out infinite;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }
      .error-title {
        font-size: 1.8rem;
        font-weight: 700;
        margin-bottom: 10px;
        color: #fff;
      }
      .error-desc {
        font-size: 1rem;
        color: #94a3b8;
        margin-bottom: 40px;
        max-width: 450px;
        margin-left: auto;
        margin-right: auto;
        line-height: 1.6;
      }
      .btn-home {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 15px 35px;
        background: linear-gradient(135deg, #ffb703, #ff8c00);
        color: #000;
        text-decoration: none;
        border-radius: 30px;
        font-weight: 900;
        font-size: 1.1rem;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 5px 25px rgba(255, 183, 3, 0.4);
      }
      .btn-home:hover {
        transform: scale(1.05) translateY(-2px);
        box-shadow: 0 8px 35px rgba(255, 183, 3, 0.6);
      }
      .btn-home:active {
        transform: scale(0.98);
      }
      .links {
        margin-top: 30px;
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .links a {
        color: #64748b;
        text-decoration: none;
        font-size: 0.85rem;
        transition: color 0.2s;
      }
      .links a:hover {
        color: #00d2ff;
      }
      .particles {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <canvas class="particles" id="particles"></canvas>
    <div class="container">
      <div class="error-icon"><i class="fa-solid fa-motorcycle"></i></div>
      <div class="error-code">404</div>
      <h1 class="error-title">Route introuvable</h1>
      <p class="error-desc">
        Cette page n'existe pas ou a été déplacée. Pas de panique, même les
        meilleurs pilotes prennent parfois un mauvais virage ! 🏍️
      </p>
      <a href="/" class="btn-home">
        <i class="fa-solid fa-house"></i> Retour à l'accueil
      </a>
      <div class="links">
        <a href="login.html">Se connecter</a>
        <a href="mentions-legales.html">Mentions légales</a>
        <a href="privacy.html">Confidentialité</a>
        <a href="terms.html">CGU</a>
      </div>
    </div>
    <script>
      const canvas = document.getElementById("particles");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const particles = [];
      for (let i = 0; i < 40; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          r: Math.random() * 2 + 1,
          color: [
            "rgba(255,183,3,0.3)",
            "rgba(0,210,255,0.3)",
            "rgba(255,0,85,0.2)",
          ][Math.floor(Math.random() * 3)],
        });
      }
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
          if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();
        });
        requestAnimationFrame(draw);
      }
      draw();
      window.addEventListener("resize", () => {
        canvas.width = innerWidth;
        canvas.height = innerHeight;
      });
    </script>
  </body>
</html>
