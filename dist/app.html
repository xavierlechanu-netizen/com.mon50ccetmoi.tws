    <!-- Chargeur Dynamique Google Maps avec Gestion d'Erreur -->
    <script>
      window.mapsSDKLoaded = false;

      window.initMap = function () {
        console.log("mon50cc Maps : SDK chargÃ© avec succÃ¨s.");
        window.mapsSDKLoaded = true;
        if (typeof window.initMapController === "function") {
          window.initMapController();
        }
      };

      function loadMapsSDK() {
        const isAndroid = /Android/i.test(navigator.userAgent);
        const selectedKey =
          typeof CONFIG !== "undefined" && CONFIG.MAPS
            ? isAndroid
              ? CONFIG.MAPS.ANDROID
              : CONFIG.MAPS.PC
            : "";

        if (!selectedKey) {
          console.error("mon50cc Loader : ClÃ© API Maps manquante !");
          forceStartApp("ERREUR_CONFIG_API");
          return;
        }

        const script = document.createElement("script");
        script.src = `https://maps.googleapis.com/maps/api/js?key=${selectedKey}&libraries=geometry,places,marker&v=beta&callback=initMap&loading=async`;
        script.async = true;
        script.defer = true;
        script.onerror = function () {
          console.error(
            "mon50cc Loader : Ã‰chec critique du chargement Maps SDK.",
          );
          forceStartApp("Ã‰CHEC_RÃ‰SEAU_SDK");
        };
        document.head.appendChild(script);
      }

      function initFallbackMap() {
        try {
          if (window.fallbackMapInitialized) return;
          if (typeof L === "undefined") return;
          window.fallbackMapInitialized = true;
          const mapEl = document.getElementById("map");
          if (!mapEl) return;

          mapEl.innerHTML = "";
          const leafletMap = L.map("map", {
            zoomControl: false,
            attributionControl: false,
          }).setView([48.8566, 2.3522], 14);
          window.leafletMap = leafletMap; // Rendre accessible globalement pour le suivi GPS

          L.tileLayer(
            "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
            {
              maxZoom: 19,
            },
          ).addTo(leafletMap);

          const neonIcon = L.divIcon({
            html: '<div style="width:16px;height:16px;background:#00d2ff;border-radius:50%;box-shadow:0 0 10px #00d2ff, 0 0 20px #00d2ff;border:2px solid #fff;"></div>',
            className: "",
            iconSize: [16, 16],
          });
          window.leafletUserMarker = L.marker([48.8566, 2.3522], {
            icon: neonIcon,
          }).addTo(leafletMap);

          // Fonction de mise Ã  jour GPS pour la carte Leaflet
          window.updatePositionLeaflet = function (lat, lng) {
            if (window.leafletMap) {
              window.leafletMap.panTo([lat, lng]);
            }
            if (window.leafletUserMarker) {
              window.leafletUserMarker.setLatLng([lat, lng]);
            }
          };

          console.log(
            "mon50cc : Fallback Leaflet Map Initialized (GPS-linked)",
          );
        } catch (e) {
          console.error("mon50cc : Leaflet Fallback failed", e);
        }
      }

      function forceStartApp(reason) {
        console.warn("mon50cc : DÃ©marrage forcÃ© (" + reason + ")");
        const statusEl = document.getElementById("loader-status");
        if (statusEl) statusEl.textContent = "Lancement (Mode DÃ©gradÃ©)...";

        // On s'assure que checkAuth est dÃ©fini (fail-safe)
        if (typeof window.checkAuth !== "function") {
          window.checkAuth = () => {
            return { username: "Pilote", isGuest: true };
          };
        }

        setTimeout(initFallbackMap, 500);

        setTimeout(() => {
          if (typeof window.startApp === "function") window.startApp();
        }, 800);
      }

      // --- CORE NAVIGATION (ULTIMATE BYPASS) ---
      window.toggleMenu = function () {
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");
        if (sidebar) {
          sidebar.classList.toggle("active");
          if (overlay) overlay.classList.toggle("active");
          console.log("mon50cc : Menu Toggle (Bypass Mode)");
        }
      };

      // --- CACHE PURGE FORCE ---
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (let registration of registrations) {
            if (window.location.search.includes("purge=true")) {
              registration.unregister();
              console.log("mon50cc : Service Worker Unregistered (Purge Mode)");
            }
          }
        });
      }

      // On lance le chargement dÃ¨s que config.js est lÃ 
      window.addEventListener("load", () => {
        // Pattern Promise : charger Maps avec fallback propre (plus de race conditions setTimeout)
        const mapsReady = new Promise((resolve) => {
          loadMapsSDK();
          // VÃ©rifier pÃ©riodiquement si Maps est chargÃ©
          const check = setInterval(() => {
            if (window.mapsSDKLoaded) { clearInterval(check); resolve('maps'); }
          }, 200);
        });

        const timeout = new Promise((resolve) => {
          setTimeout(() => resolve('timeout'), 5000);
        });

        Promise.race([mapsReady, timeout]).then((winner) => {
          if (winner === 'timeout' && !window.mapsSDKLoaded) {
            console.warn("mon50cc : Google Maps trop long, fallback sur Leaflet");
            forceStartApp("TIMEOUT_SDK");
          }
        });

        // DÃ©marrage de l'app une fois les modules chargÃ©s
        Promise.resolve().then(() => {
          if (typeof window.startApp === "function") window.startApp();
        });

        // Masquer le loader aprÃ¨s un dÃ©lai raisonnable
        setTimeout(() => {
          const loader = document.getElementById("app-loader");
          if (loader && loader.style.visibility !== "hidden") {
            console.warn("mon50cc : Hiding Loader");
            loader.style.opacity = "0";
            setTimeout(() => (loader.style.visibility = "hidden"), 800);
          }
        }, 2000);
      });
    </script>

    <script>
      // INIT APEX SENTINEL
      window.addEventListener("load", () => {
        if (window.QuantumCrypto) window.QuantumCrypto.init();
        if (window.ZeroTrust) window.ZeroTrust.init();

        // Firebase Analytics â€” Track user engagement
        try {
          if (typeof firebase !== "undefined" && firebase.analytics) {
            window.mon50Analytics = firebase.analytics();
            if (
              window.mon50Analytics &&
              typeof window.mon50Analytics.logEvent === "function"
            ) {
              window.mon50Analytics.logEvent("app_open", {
                version: "110.00.00",
              });
            }
            console.log("mon50cc : Firebase Analytics initialisÃ©.");
          }
        } catch (e) {
          console.warn("Analytics init skipped:", e.message);
        }

        // WebGL / Canvas Holographic Effect (Simplified for performance)
        const canvas = document.getElementById("quantum-bg");
        if (canvas) {
          const ctx = canvas.getContext("2d");
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          let particles = [];
          let animationId = null;
          for (let i = 0; i < 50; i++) {
            particles.push({
              x: Math.random() * canvas.width,
              y: Math.random() * canvas.height,
              vx: (Math.random() - 0.5) * 0.5,
              vy: (Math.random() - 0.5) * 0.5,
            });
          }
          function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "rgba(0, 255, 204, 0.5)";
            particles.forEach((p) => {
              p.x += p.vx;
              p.y += p.vy;
              if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
              if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
              ctx.beginPath();
              ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
              ctx.fill();
            });
            animationId = requestAnimationFrame(draw);
          }
          draw();

          // PERFORMANCE : Pauser l'animation quand l'onglet n'est pas visible (batterie)
          document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
              if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
            } else {
              if (!animationId) draw();
            }
          });
        }
      });
    </script>

    <script>
      function updateHoloVehicle(type) {
        const icon = document.getElementById("holo-vehicle-icon");
        if (!icon) return;

        // Add glitch effect
        icon.style.opacity = "0";
        icon.style.transform = "scale(0.8)";

        setTimeout(() => {
          let html = "";
          if (type === "vsp") {
            html = '<i class="fa-solid fa-car-side"></i>';
            icon.style.color = "#ff0055";
            icon.style.filter = "drop-shadow(0 0 15px #ff0055)";
          } else if (type === "moto") {
            html = '<i class="fa-solid fa-motorcycle"></i>';
            icon.style.color = "#b700ff";
            icon.style.filter = "drop-shadow(0 0 15px #b700ff)";
          } else {
            html = '<i class="fa-solid fa-motorcycle"></i>';
            icon.style.color = "#00d2ff";
            icon.style.filter = "drop-shadow(0 0 15px #00d2ff)";
          }
          icon.innerHTML = html;
          icon.style.opacity = "1";
          icon.style.transform = "scale(1)";
        }, 200);
      }
    </script>

    <!-- UI Panel BoÃ®te Noire -->

    <script>
      // Binding UI pour la BoÃ®te Noire
      document.addEventListener('DOMContentLoaded', () => {
        if (!window.BlackBox) return;

        window.BlackBox.onConnectionChange = (connected) => {
          const btn = document.getElementById('bb-connect-btn');
          const exportBtn = document.getElementById('bb-export-btn');
          if (connected) {
            btn.innerHTML = '<i class="fa-solid fa-unlink"></i> DÃ©connecter';
            btn.style.background = 'linear-gradient(135deg, #555, #333)';
            btn.onclick = () => window.BlackBox.disconnect();
            exportBtn.style.display = 'block';
          } else {
            btn.innerHTML = '<i class="fa-brands fa-bluetooth"></i> Connecter';
            btn.style.background = 'linear-gradient(135deg, #ff3333, #aa0000)';
            btn.onclick = () => window.BlackBox.connect();
            exportBtn.style.display = 'none';
            document.getElementById('bb-batt').innerText = '-- mV';
            document.getElementById('bb-tamper').innerText = 'Intact';
            document.getElementById('bb-tamper').style.color = '#fff';
          }
        };

        window.BlackBox.onDiagnosticUpdate = (diag) => {
          document.getElementById('bb-batt').innerText = diag.battery_mv + ' mV';
          const tamperEl = document.getElementById('bb-tamper');
          if (diag.tamper_state === 1) {
            tamperEl.innerText = 'EFFRACTION!';
            tamperEl.style.color = '#ff0055';
          } else {
            tamperEl.innerText = 'Intact';
            tamperEl.style.color = '#fff';
          }
        };

        window.BlackBox.onTelemetryData = (data) => {
          // Flash visuel pour indiquer la rÃ©ception
          const panel = document.getElementById('blackbox-ui-panel');
          panel.style.boxShadow = '0 0 50px rgba(0, 255, 136, 0.5)';
          setTimeout(() => { panel.style.boxShadow = '0 0 30px rgba(255, 51, 51, 0.2)'; }, 200);
        };
      });
    </script>
